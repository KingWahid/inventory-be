# Kong DB-less declarative config — PRODUCTION (Railway)
# Service URLs use Railway private networking: <service-name>.railway.internal
_format_version: "3.0"
_transform: true

services:
  - name: inventory-api
    url: http://inventory-api.railway.internal:8080
    routes:
      - name: inventory-api-routes
        paths:
          - /api/v1/inventory
        strip_path: false

  - name: authentication-service
    url: http://authentication.railway.internal:8082
    routes:
      - name: auth-login-rate-limit
        paths:
          - /api/v1/auth/login
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              second: 5
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: auth-register-rate-limit
        paths:
          - /api/v1/auth/register
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              second: 5
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: authentication-service-routes
        paths:
          - /api/v1/auth
        strip_path: false

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: cors
    config:
      origins:
        - "https://your-app.vercel.app"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Request-Id
      exposed_headers:
        - X-Request-Id
      credentials: true
      max_age: 3600
